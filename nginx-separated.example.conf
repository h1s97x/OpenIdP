# =============================================================
# OpenIdP · 前后端分离部署（可选方案）
#
# 场景：前端 SPA 由 Nginx / Cloudflare Pages / Vercel 等静态托管，
#       后端 Go API 独立运行（单容器或独立进程）。
#
# 一、后端只需开放 API（无需内嵌前端），以下开关需要一并配置：
#   - OPENIDP_CORS_ALLOWED_ORIGINS=https://auth.example.com  允许跨域（必须）
#   - OPENIDP_SITE_URL=https://auth.example.com               OAuth 回调域名
#   - OPENIDP_WEBAUTHN_ORIGIN=https://auth.example.com        WebAuthn 源
#   - OPENIDP_CLIENT_IP_HEADER=...                            见下方「真实 IP」说明（通常无需设置）
#
#   ⚠️ 跨「站」部署（前后端不同 eTLD+1）必须是 HTTPS：
#      跨源请求要带上会话 Cookie，Cookie 的 SameSite 会被设为 None，
#      而浏览器强制要求 SameSite=None 的 Cookie 必须带 Secure，
#      非 HTTPS 下该 Cookie 会被直接丢弃，表现为「接口能调通但始终是未登录」。
#      配置了 CORS_ALLOWED_ORIGINS 后本项自动生效，也可用
#      OPENIDP_COOKIE_SAME_SITE / OPENIDP_COOKIE_SECURE 显式指定。
#      仅同站子域（auth.example.com ↔ api.example.com）时用默认 Lax 即可。
#
#   ⚠️ 前端需使用 credentials: 'include' 发起请求（本项目前端已内置）。
#
# 二、真实 IP（重要）
#
#   客户端 IP 的取值优先级为：专用真实 IP 头 → X-Forwarded-For（从右往左）→ TCP 对端。
#   默认信任回环 + 内网网段内的对端：Nginx 与应用同机 / 同内网时无需任何配置。
#
#   专用真实 IP 头按固定顺序自动嗅探（EO-Client-IP → EO-Connecting-IP →
#   CF-Connecting-IP → ali-real-client-ip → True-Client-IP），
#   也可由「管理后台 → 系统设置 → 归属地 → 客户端 IP 请求头」或
#   OPENIDP_CLIENT_IP_HEADER 显式指定：
#
#     CDN                    头名                   控制台开关（默认均关闭，必须手动开启）
#     腾讯云 EdgeOne         EO-Client-IP           站点加速 → 网络优化 → 客户端 IP 头部
#     阿里云 ESA             ali-real-client-ip     规则 → 转换规则 → 托管转换 → 添加真实客户端 IP 标头
#     Cloudflare            CF-Connecting-IP        默认携带
#
#   X-Forwarded-For 一律从右往左跳过可信跳与内网地址定位真实客户端，
#   客户端在最左侧前插的伪造值不生效。CDN 节点直连应用（无第二层反代）时，
#   用 OPENIDP_TRUSTED_PROXIES 填入 CDN 官方公布的回源网段。
#
#   ⚠ 下面这两行在 CDN 场景下是错的，不要照抄：
#     proxy_set_header X-Real-IP        $remote_addr;   # 会变成 CDN 回源节点 IP
#     proxy_set_header CF-Connecting-IP $remote_addr;   # 同上
#   $remote_addr 是「直连 Nginx 的那一跳」，CDN 之后它等于 CDN 节点 IP，
#   不是用户 IP。CDN 的专用头由 Nginx 默认透传，无需显式设置。
#
# 三、本文件是 Nginx 反代示例（把前端 dist 与 /api、/login、/.well-known
#     分别代理，并叠加 CDN 缓存头）。可直接用于单机前后端分离。
#
# 四、静态资源缓存策略（与后端内嵌模式一致）：
#   - /assets/*  → Cache-Control: public, max-age=31536000, immutable（Vite 指纹）
#   - /images/*  → Cache-Control: public, max-age=86400
#   - /          → index.html no-cache（始终回源校验）
#   - /api、/.well-known、/login/oauth → 不缓存（no-store）
#
# 五、⚠️ OIDC 路径必须用「前缀匹配」（location ^~），不要用正则 location
#
#    很多面板（宝塔 / 1Panel 等）默认会加一条隐藏文件拦截规则，例如：
#
#      location ~ /\.(git|env|svn|htaccess|user.ini) { return 404; }
#      location ~ /\. { deny all; }
#
#    `.well-known` 以点开头，会被这类正则规则命中，导致
#    /.well-known/openid-configuration 返回 404，OIDC 自动发现失败。
#
#    Nginx 的 location 优先级：精确 = > 前缀 ^~ > 正则 ~（按出现顺序）> 普通前缀。
#    因此写成 `location ^~ /.well-known/` 会立刻命中并停止匹配正则，
#    无论后面/前面是否还有隐藏文件规则都不会被拦截 —— 这是最稳妥的写法。
#
#    判断命中该问题的典型现象（对照看下即可确认）：
#      curl -i https://你的域名/api/health                       → 200 JSON（正常）
#      curl -i https://你的域名/login/oauth/authorize            → 400 JSON（正常，到达了后端）
#      curl -i https://你的域名/一个不存在的随机路径               → 200 HTML（SPA fallback）
#      curl -i https://你的域名/.well-known/openid-configuration → 404，body 却是首页 HTML
#    最后一条「body 是首页、状态码却是 404」说明 404 由 Nginx 产生而非后端：
#    后端对未知路径只会返回 200 的 SPA fallback，不会返回 404。
# =============================================================

server {
    listen 80;
    server_name auth.example.com;

    # ---------- API / OIDC：反代到 Go 后端 ----------
    # 说明：CDN 写入的真实 IP 头（EO-Client-IP / ali-real-client-ip 等）由
    # proxy_pass 默认透传，不要在这里用 $remote_addr 覆盖它们。
    location /api/ {
        proxy_pass http://127.0.0.1:6099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 认证接口不缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # OIDC 发现 / JWKS：必须用 ^~ 前缀匹配，避开面板常见的隐藏文件拦截正则
    # （见文件头第五点）。写成 location ~ ^/\.well-known/ 可能被其它正则抢先。
    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:6099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # 授权端点
    location ^~ /login/oauth/ {
        proxy_pass http://127.0.0.1:6099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # ---------- 前端静态资源 ----------
    root /var/www/openidp;   # 放置 web/dist 内容

    # Vite 产物带内容哈希 → 强缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 站点图标等静态图片
    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback → index.html（不缓存）
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
